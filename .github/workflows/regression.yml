name: Regression

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: 回归检查 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 安装测试所需的中文字体
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: 校验推送前门禁行为
        run: bash scripts/test-pre-push.sh
      - name: 校验发布产物汇总行为
        if: runner.os == 'Linux'
        run: bash scripts/test-release-assets.sh
      - name: 构建、静态检查与回归测试
        run: bash scripts/check.sh
