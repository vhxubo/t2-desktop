name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 校验版本、发布说明和签名配置
        id: version
        env:
          HAS_SIGNING_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY != '' }}
        run: |
          bash scripts/release-metadata.sh "$GITHUB_REF_NAME" >/dev/null
          if [[ "$HAS_SIGNING_KEY" != true ]]; then
            echo '缺少 MYGO_UPDATER_PRIVATE_KEY secret。' >&2
            exit 1
          fi
          case "${GITHUB_REF_NAME%%+*}" in
            *-*) echo 'prerelease=true' >> "$GITHUB_OUTPUT" ;;
            *)   echo 'prerelease=false' >> "$GITHUB_OUTPUT" ;;
          esac

  release-gate:
    needs: metadata
    uses: ./.github/workflows/regression.yml

  build:
    needs: release-gate
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 安装 NSIS
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: 构建并签名更新包
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -o build/release
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: |
            build/release/SHA256SUMS
            build/release/*/update-*.json
            build/release/*/*-setup-*.exe
            build/release/*/*.dmg
            build/release/*/*.deb
            build/release/*/*.rpm
            build/release/*/*.tar.gz
            build/release/*/*.delta
            build/release/*/install.sh
            build/release/*/install.ps1
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
      - name: 校验并汇总产物
        run: bash scripts/collect-release-assets.sh artifacts release-assets "$GITHUB_REF_NAME"
      - name: 上传到草稿并发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          bash scripts/release-metadata.sh "$GITHUB_REF_NAME" > "$notes"
          flags=(--latest)
          if [[ "$PRERELEASE" == true ]]; then flags=(--prerelease --latest=false); fi

          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" != true ]]; then
              echo '该版本已发布，不覆盖现有发行包。' >&2
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" \
              --notes-file "$notes" "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false "${flags[@]}"
