name: Release

# 推送 tag 即发布：tag 必须与 mygo.json 的 version 一致（例如 v0.1.0）。
# 每个平台在自己的 runner 上并行构建，签名更新包，并上传到同一个 draft
# release；全部平台成功后再自动发布，应用里的「检查更新」读取的就是它。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 创建 draft release，并向其中上传构建产物

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # MyGo 不需要 cgo；关掉它也能让构建结果与 go.mod 无关地保持可复现。
  CGO_ENABLED: "0"

jobs:
  draft-release:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: 校验 tag 与 mygo.json 的版本
        id: version
        run: |
          set -euo pipefail
          version="$(jq -r .version mygo.json)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME 与 mygo.json 的 version $version 不一致；先改版本再打 tag。" >&2
            exit 1
          fi
          # 预发布版本（带 -beta.1 之类的后缀）只发布成 prerelease，不占用
          # latest，普通用户不会被提示升级到它。
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: 创建 draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          # 重跑工作流时沿用已有的 draft，只替换里面的文件。
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 的 dmg 只能在 macOS runner 上制作；Apple Silicon 与 Intel
          # 各出一份，各自带自己的更新清单。没有配置 Developer ID 时是 ad hoc
          # 签名，别的 Mac 首次打开会被 Gatekeeper 拦下；在 mygo.json 里设置
          # macos.signingIdentity / macos.notarize 后即自动签名并公证。
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          # Windows 的 exe 与安装包可以在 Ubuntu 上交叉编译，NSIS 从 apt 装。
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: 检查更新签名密钥
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "缺少 MYGO_UPDATER_PRIVATE_KEY secret：填入 mygo keygen 生成的 mygo-update.key 内容。" >&2
            exit 1
          fi
      - name: 安装 NSIS（Windows 安装包）
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: 构建并上传
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 发布 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            *-*) gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                   --draft=false --prerelease ;;
            *)   gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                   --draft=false ;;
          esac
